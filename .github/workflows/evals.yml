name: Run evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      eval_name:
        description: 'Eval to run — name from evals.json (e.g. startup-chaos) or "all"'
        required: false
        default: all
        type: string
      model:
        description: 'Ollama model under test'
        required: false
        default: llama3.2
        type: choice
        options:
          - llama3.2
          - llama3.1:8b
          - mistral
      judge_model:
        description: 'Ollama model used as the DeepEval judge'
        required: false
        default: mistral
        type: choice
        options:
          - llama3.2
          - llama3.1:8b
          - mistral
      min_pass_rate:
        description: 'GEval threshold per assertion (0.0–1.0)'
        required: false
        default: '0.80'
        type: string

concurrency:
  group: evals-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        run: ollama serve &

      - name: Wait for Ollama
        run: |
          until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do sleep 1; done
          echo "Ollama ready"

      - name: Pull models
        env:
          MODEL: ${{ inputs.model || 'llama3.2' }}
          JUDGE_MODEL: ${{ inputs.judge_model || 'mistral' }}
        run: |
          ollama pull "$MODEL"
          ollama pull "$JUDGE_MODEL"

      - name: Run evals
        env:
          OLLAMA_MODEL: ${{ inputs.model || 'llama3.2' }}
          OLLAMA_JUDGE_MODEL: ${{ inputs.judge_model || 'mistral' }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.80' }}
          EVAL_NAME: ${{ inputs.eval_name || 'all' }}
        run: |
          # -n 2 (not 5): on the shared ubuntu-latest runner, 5 concurrent
          # CPU-bound Ollama requests contend hard enough to blow past
          # OLLAMA_REQUEST_TIMEOUT (see CONTRIBUTING.md#running-the-evals).
          # --reruns retries a scenario that fails once — small local models
          # are noisier than a frontier judge, so a single borderline result
          # is treated as signal to re-run, not an immediate hard failure
          # (see CONTRIBUTING.md#grading-rules).
          if [[ "$EVAL_NAME" == "all" ]]; then
            uv run pytest evals/ -v -n 2 --reruns 2 --reruns-delay 10
          else
            uv run pytest evals/ -v -k "$EVAL_NAME" --reruns 2 --reruns-delay 10
          fi
