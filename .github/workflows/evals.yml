name: Run evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      eval_name:
        description: 'Eval to run — name from evals.json (e.g. startup-chaos) or "all"'
        required: false
        default: all
        type: string
      model:
        description: 'Ollama model under test'
        required: false
        default: llama3.2
        type: choice
        options:
          - llama3.2
          - llama3.1:8b
          - mistral
      judge_model:
        description: 'Ollama model used as the DeepEval judge'
        required: false
        default: mistral
        type: choice
        options:
          - llama3.2
          - llama3.1:8b
          - mistral
      min_pass_rate:
        description: 'GEval threshold per assertion (0.0–1.0)'
        required: false
        default: '0.80'
        type: string

concurrency:
  group: evals-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The plugin ships one manifest per ecosystem (Agent Plugins, Claude Code,
  # Codex) and they all carry the same name and version — a release that
  # bumps only one of them installs as the wrong version everywhere else.
  # Cheap check, no Ollama, no matrix: runs on every PR and push.
  manifest-consistency:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check manifests agree on name and version
        run: |
          manifests=(plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json)
          for f in "${manifests[@]}" .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

          expected_name=$(jq -r .name plugin.json)
          expected_version=$(jq -r .version plugin.json)
          status=0
          for f in "${manifests[@]}"; do
            name=$(jq -r .name "$f")
            version=$(jq -r .version "$f")
            if [ "$name" != "$expected_name" ]; then
              echo "::error file=$f::name is '$name', expected '$expected_name' (plugin.json)"
              status=1
            fi
            if [ "$version" != "$expected_version" ]; then
              echo "::error file=$f::version is '$version', expected '$expected_version' (plugin.json)"
              status=1
            fi
          done
          exit $status

  # Runs the full suite, one sub-suite per matrix job — each job gets its own
  # runner and its own Ollama instance, so sub-suites run in true parallel
  # instead of contending for one shared CPU-only runner (which is why -n
  # inside a single job is capped low, see the run-evals step below). Used
  # whenever the full suite is in scope: every PR, every push to main, and
  # workflow_dispatch with eval_name left at "all".
  run-evals-matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.eval_name == 'all' || inputs.eval_name == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the sub-suite directories under evals/ — add the
        # new directory here when a new skill gets its own eval sub-suite.
        suite:
          - audit
          - strategy
          - daily_prevention
          - reality_check
          - breaking_change_detector
          - test_selection
          - default
    env:
      MODEL: ${{ inputs.model || 'llama3.2' }}
      JUDGE_MODEL: ${{ inputs.judge_model || 'mistral' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-${{ env.MODEL }}-${{ env.JUDGE_MODEL }}

      - name: Start Ollama service
        run: ollama serve &

      - name: Wait for Ollama
        run: |
          until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do sleep 1; done
          echo "Ollama ready"

      - name: Pull models
        run: |
          ollama pull "$MODEL"
          ollama pull "$JUDGE_MODEL"

      - name: Run evals — ${{ matrix.suite }}
        env:
          OLLAMA_MODEL: ${{ env.MODEL }}
          OLLAMA_JUDGE_MODEL: ${{ env.JUDGE_MODEL }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.80' }}
        run: |
          # -n 2 (not 5): even with one sub-suite per job, a shared
          # CPU-only runner can't take much concurrent Ollama load before
          # OLLAMA_REQUEST_TIMEOUT starts flaking (see
          # CONTRIBUTING.md#running-the-evals). --reruns retries a
          # scenario that fails once — small local models are noisier
          # than a frontier judge, so a single borderline result is
          # treated as signal to re-run, not an immediate hard failure
          # (see CONTRIBUTING.md#grading-rules).
          uv run pytest evals/${{ matrix.suite }} -v -n 2 --reruns 2 --reruns-delay 10

  # workflow_dispatch with a specific scenario name: too narrow to benefit
  # from the matrix (we don't know which sub-suite owns it without scanning
  # evals.json), so run it directly against the whole evals/ tree as before.
  run-single-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.eval_name != 'all' && inputs.eval_name != ''
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ inputs.model || 'llama3.2' }}
      JUDGE_MODEL: ${{ inputs.judge_model || 'mistral' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-${{ env.MODEL }}-${{ env.JUDGE_MODEL }}

      - name: Start Ollama service
        run: ollama serve &

      - name: Wait for Ollama
        run: |
          until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do sleep 1; done
          echo "Ollama ready"

      - name: Pull models
        run: |
          ollama pull "$MODEL"
          ollama pull "$JUDGE_MODEL"

      - name: Run evals — ${{ inputs.eval_name }}
        env:
          OLLAMA_MODEL: ${{ env.MODEL }}
          OLLAMA_JUDGE_MODEL: ${{ env.JUDGE_MODEL }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.80' }}
        run: |
          uv run pytest evals/ -v -k "${{ inputs.eval_name }}" --reruns 2 --reruns-delay 10
