name: Run evals

on:
  workflow_dispatch:
    inputs:
      eval_name:
        description: 'Eval to run — name from evals.json (e.g. startup-chaos) or "all"'
        required: false
        default: all
        type: string
      model:
        description: 'Ollama model under test'
        required: false
        default: llama3.2
        type: choice
        options:
          - llama3.2
          - llama3.1:8b
          - mistral
      judge_model:
        description: 'Ollama model used as the DeepEval judge'
        required: false
        default: mistral
        type: choice
        options:
          - llama3.2
          - llama3.1:8b
          - mistral
      min_pass_rate:
        description: 'GEval threshold per assertion (0.0–1.0)'
        required: false
        default: '0.80'
        type: string

jobs:
  run-evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        run: ollama serve &

      - name: Wait for Ollama
        run: |
          until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do sleep 1; done
          echo "Ollama ready"

      - name: Pull models
        run: |
          ollama pull ${{ inputs.model }}
          ollama pull ${{ inputs.judge_model }}

      - name: Run evals
        env:
          OLLAMA_MODEL: ${{ inputs.model }}
          OLLAMA_JUDGE_MODEL: ${{ inputs.judge_model }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
        run: |
          if [[ "${{ inputs.eval_name }}" == "all" ]]; then
            uv run pytest minottobot/evals/test_evals.py -v -n 5
          else
            uv run pytest minottobot/evals/test_evals.py -v -k "${{ inputs.eval_name }}"
          fi
