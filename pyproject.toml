[project]
name = "minottobot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.1.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=14.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
# tests/ is the fast, LLM-free suite for scripts/snapshot.py; evals/ needs a
# local Ollama. Run them separately in practice: `pytest tests`, `pytest evals`.
testpaths = ["tests", "evals"]
